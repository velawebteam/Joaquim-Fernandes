    <noscript><!-- PRERENDER:START --><div style="font-family:Montserrat,sans-serif;color:#1f2937;max-width:1120px;margin:0 auto;padding:32px 20px"><header><p><strong>Joaquim &amp; Fernandes, Lda</strong> — Eletricidade é Connosco!</p><nav aria-label="Navegação"><a href="/">Início</a> | <a href="/sobre">Sobre Nós</a> | <a href="/servicos">Serviços</a> | <a href="/iluminacao">Iluminação</a> | <a href="/parceiros">Parceiros</a> | <a href="/recrutamento">Recrutamento</a> | <a href="/contacto">Contactos</a> | <a href="/perguntas-frequentes">FAQs</a></nav></header><main><h1>Política de Privacidade</h1><p>A JF respeita a sua privacidade e compromete-se a proteger os seus dados pessoais. Esta política descreve como recolhemos, utilizamos e protegemos a sua informação, em conformidade com o Regulamento Geral de Proteção de Dados (Regulamento (UE) 2016/679 — RGPD) e com a Lei n.º 58/2019, de 8 de agosto.</p><section><h2>Identificação Legal da Empresa</h2><ul><li><strong>Denominação Social:</strong> Joaquim &amp; Fernandes - Electricidade e Telecomunicações LDA</li><li><strong>NIF:</strong> PT 501717307</li><li><strong>Email:</strong> mail@joaquimfernandes.pt</li><li><strong>Morada:</strong> Est. Nac 125 Bias do Norte 8700-066 Olhão, 8700-066, Olhão</li></ul></section><section><h2>1. Responsável pelo Tratamento</h2><p>A entidade responsável pelo tratamento dos seus dados pessoais é a Joaquim &amp; Fernandes - Electricidade e Telecomunicações LDA (NIF: PT 501717307), com sede em Est. Nac 125 Bias do Norte 8700-066 Olhão, 8700-066, Olhão. Para qualquer questão relacionada com a proteção de dados ou para exercer os seus direitos, pode contactar-nos através do email mail@joaquimfernandes.pt ou do telefone +351 289 790 500.</p></section><section><h2>2. Dados Recolhidos</h2><p>Recolhemos os dados pessoais que nos fornece voluntariamente através dos nossos formulários de contacto, pedidos de orçamento, propostas de parceria e candidaturas de emprego. Estes podem incluir: Nome, Email, Telefone, Morada, dados da empresa, fotografias/projetos técnicos e Curriculum Vitae (no caso de recrutamento). Recolhemos também dados estritamente necessários de preferência técnica (cookies/armazenamento local) conforme descrito na nossa Política de Cookies.</p></section><section><h2>3. Finalidade e Fundamento Jurídico do Tratamento</h2><p>Os seus dados são tratados apenas quando existe fundamento jurídico válido ao abrigo do artigo 6.º do RGPD:
- Gestão de pedidos de orçamento, esclarecimentos e contactos comerciais (diligências pré-contratuais a pedido do titular e interesse legítimo);
- Execução de contratos de prestação de serviços e empreitadas (execução contratual);
- Processos de recrutamento e seleção mediante envio de candidatura e CV (consentimento e diligências pré-contratuais);
- Cumprimento de obrigações legais e fiscais, nomeadamente faturação e arquivo contabilístico (obrigação jurídica).</p></section><section><h2>4. Partilha de Dados e Subcontratantes</h2><p>Não vendemos nem cedemos os seus dados a terceiros para fins comerciais. Os seus dados podem ser comunicados apenas a subcontratantes estritamente necessários à operação do website e prestação do serviço (ex.: alojamento, processamento seguro de formulários, contabilidade e suporte informático), vinculados por contrato e obrigação de confidencialidade nos termos do RGPD, ou a autoridades públicas e judiciais quando exigido por lei.</p></section><section><h2>5. Prazos de Conservação</h2><p>Os dados pessoais são conservados apenas pelo período estritamente necessário à finalidade para a qual foram recolhidos ou pelo prazo imposto por lei:
- Dados de faturação e documentos contratuais/fiscais: 10 anos (nos termos da legislação fiscal portuguesa);
- Pedidos de orçamento e contactos comerciais sem adjudicação: até 2 anos após o último contacto;
- Candidaturas espontâneas e processos de recrutamento: até 1 ano após a conclusão do processo ou receção do CV, salvo solicitação anterior de apagamento.</p></section><section><h2>6. Direitos do Titular e Reclamação à CNPD</h2><p>Nos termos do RGPD e da Lei n.º 58/2019, tem o direito de acesso, retificação, apagamento (direito ao esquecimento), limitação do tratamento, portabilidade dos dados e oposição ao tratamento, bem como o direito de retirar o consentimento a qualquer momento sem comprometer a licitude do tratamento efetuado até então.

Para exercer estes direitos, envie o seu pedido por escrito para mail@joaquimfernandes.pt.

Caso considere que o tratamento dos seus dados viola a legislação em vigor, tem igualmente o direito de apresentar reclamação junto da autoridade de controlo competente em Portugal:
Comissão Nacional de Proteção de Dados (CNPD) — Av. D. Carlos I, 134, 1.º, 1200-651 Lisboa | Tel.: +351 213 928 400 | Email: geral@cnpd.pt | Website: www.cnpd.pt.</p></section><section><h2>7. Segurança dos Dados</h2><p>Implementamos medidas técnicas e organizativas adequadas (incluindo comunicações encriptadas via HTTPS e controlo de acesso restrito) para proteger os seus dados pessoais contra perda, destruição, alteração ou acesso não autorizado.</p></section></main><footer><address>Estrada Nacional 125, Bias Norte, Moncarapacho, 8700-066 Olhão, Portugal | Tel: +351 289 790 500 | Email: mail@joaquimfernandes.pt</address></footer></div><!-- PRERENDER:END --></noscript>
