    <noscript><!-- PRERENDER:START --><div style="font-family:Montserrat,sans-serif;color:#1f2937;max-width:1120px;margin:0 auto;padding:32px 20px"><header><p><strong>Joaquim &amp; Fernandes, Lda</strong> — Eletricidade é Connosco!</p><nav aria-label="Navegação"><a href="/">Início</a> | <a href="/sobre">Sobre Nós</a> | <a href="/servicos">Serviços</a> | <a href="/iluminacao">Iluminação</a> | <a href="/parceiros">Parceiros</a> | <a href="/recrutamento">Recrutamento</a> | <a href="/contacto">Contactos</a> | <a href="/perguntas-frequentes">FAQs</a></nav></header><main><h1>A História da Joaquim &amp; Fernandes</h1><p>Uma equipa experiente, qualificada e comprometida com a excelência. A combinação entre conhecimento técnico, inovação e experiência permite-nos responder aos desafios do setor elétrico com eficiência, segurança e profissionalismo.</p><ul><li><strong>1986 — Fundação da Empresa</strong>: JF inicia a sua atividade como uma pequena empresa familiar focada em instalações elétricas na zona de Olhão.</li><li><strong>1992 — Mudança de Instalações</strong>: Mudança para a localização atual.</li><li><strong>1998 — Criamos o 1º Site</strong>: Lançamento da nossa primeira presença digital, acompanhando a evolução tecnológica.</li><li><strong>2000 — Líder do Consórcio</strong>: Reconhecidos como Líder do Consórcio no Algarve para a EDP (atual E-REDES).</li><li><strong>2001 — Certificação de Qualidade</strong>: Reconhecidos com a Certificação de Qualidade, reforçando o nosso compromisso com o rigor.</li><li><strong>2001 — Medalha de Dedicação</strong>: Medalha de dedicação – Grau Ouro pelo Município de Olhão.</li><li><strong>2005 — Construção de Escritórios</strong>: Construção dos escritórios atuais.</li><li><strong>2008 — 1º PME Líder</strong>: Distinção pública da nossa solidez financeira e desempenho económico.</li><li><strong>2011 — Nova Gerência</strong>: Início de um novo ciclo estratégico com a entrada de uma nova liderança.</li><li><strong>2017 — Renovação da Imagem</strong>: Modernização da identidade visual da empresa, refletindo a inovação constante.</li><li><strong>2018 — 1º PME Excelência</strong>: Selo de reputação que premeia os melhores desempenhos económico-financeiros.</li><li><strong>2021 — Aquisição da Empresa</strong>: Aquisição da JF pela gerência atual, consolidando o futuro da empresa.</li><li><strong>2026 — Selo Compromisso Pagamento Pontual.</strong>: Reconhecimento do compromisso da empresa com a pontualidade nos pagamentos aos seus fornecedores.</li></ul></main><footer><address>Estrada Nacional 125, Bias Norte, Moncarapacho, 8700-066 Olhão, Portugal | Tel: +351 289 790 500 | Email: mail@joaquimfernandes.pt</address></footer></div><!-- PRERENDER:END --></noscript>
