    <noscript><!-- PRERENDER:START --><div style="font-family:Montserrat,sans-serif;color:#1f2937;max-width:1120px;margin:0 auto;padding:32px 20px"><header><p><strong>Joaquim &amp; Fernandes, Lda</strong> — Eletricidade é Connosco!</p><nav aria-label="Navegação"><a href="/">Início</a> | <a href="/sobre">Sobre Nós</a> | <a href="/servicos">Serviços</a> | <a href="/iluminacao">Iluminação</a> | <a href="/parceiros">Parceiros</a> | <a href="/recrutamento">Recrutamento</a> | <a href="/contacto">Contactos</a> | <a href="/perguntas-frequentes">FAQs</a></nav></header><main><h1>FAQS</h1><p>Esclareça as suas dúvidas sobre os nossos serviços e procedimentos.</p><article><h2>PRECISO DE COLOCAR ELETRICIDADE NUM LOCAL. QUAIS OS PASSOS A SEGUIR?</h2><p>Para colocar eletricidade numa casa, loja ou terreno é necessário seguir alguns passos de forma organizada e segura. Na JF tratamos de todo o processo, apenas necessitamos de alguns dados/documentos tais como:

- Cartão de cidadão, para pessoa singular ou Certidão permanente, no caso de empresa;
- Morada da instalação, com indicação das coordenadas geográficas;
- Caderneta Predial;
- Contactos telefónicos e de e-mail.</p></article><article><h2>O QUE PRECISO PARA FAZER UM PEDIDO DE LIGAÇÃO À REDE (PLR) ELÉTRICA?</h2><p>Na JF tratamos de todo o processo, e realizamos um orçamento totalmente gratuito, apenas é necessário que:

- Forneça toda a documentação solicitada;
- Indique qual o tipo de ligação à rede pretendido;
- Indique qual a potência pretendida;

Após adjudicação do nosso orçamento, será ainda necessário:
- Pagamento de Taxas à E-Redes (Valores variáveis).</p></article><article><h2>QUAIS OS TIPOS DE LIGAÇÃO À REDE EXISTENTES?</h2><p>- Ligação à rede de uma moradia unifamiliar.

- Ligação à rede para uma empresa/negócio.

- Ligação à rede de uma instalação coletiva (por exemplo: prédios).

- Desvio de rede: Para alterar o local de elementos de rede existente (postes, linhas, etc.).

- Obras: Para fornecer energia elétrica temporariamente a um local, com ou sem a necessidade de ter uma ligação definitiva posteriormente.

- Eventos: Para fornecer energia elétrica a um evento específico e apenas durante o período estritamente necessário para a realização do mesmo. Estas ligações destinam-se tipicamente a circos, feiras, festas, espetáculos de rua, entre outros.</p></article><article><h2>PRECISO DE ELETRICIDADE NUM LOCAL ONDE JÁ EXISTE CONTADOR. COMO PROCEDER?</h2><p>Se o local já tiver um contador instalado, ou se já teve um contrato de eletricidade, apenas precisa de contactar um comercializador para efetuar um contrato de fornecimento de eletricidade.</p></article><article><h2>O QUE É O CPE?</h2><p>O CPE – Código de Ponto de Entrega – é o número que identifica a sua instalação elétrica.</p></article><article><h2>O QUE É NIP?</h2><p>O NIP – Número de Identificação de Prédio – é o número que identifica a instalação coletiva e com o qual é possível consultar todos os CPEs.</p></article><article><h2>PRETENDO AUMENTAR A POTÊNCIA DA MINHA INSTALAÇÃO. O QUE DEVO FAZER?</h2><p>Se a potência que pretende contratar é inferior à potência máxima admissível da instalação, o Cliente deverá solicitar um aumento de potência contratada junto do seu Comercializador.

Nas situações em que a potência que pretende contratar é superior à potência máxima admissível da instalação, o Cliente poderá solicitar-nos um orçamento para um aumento de potência.

O Cliente deverá garantir que a instalação está certificada para o novo valor de potência.

Caso seja necessário certificar a instalação, o Cliente deverá recorrer a uma entidade inspetora de instalações elétricas reconhecida pela Direção Geral de Energia e Geologia (DGEG).</p></article><article><h2>É POSSÍVEL MUDAR O LOCAL DO MEU CONTADOR?</h2><p>Sim, através de um pedido de mudança do local do contador, ou alteração do ponto de entrega.</p></article><article><h2>ESTOU SEM LUZ, QUEM DEVO CONTACTAR?</h2><p>Deverá contactar a E-Redes, através dos meios disponíveis:

Telefone: 800 506 506
WhatsApp: 913 846 398
Site: https://balcaodigital.e-redes.pt/home</p></article><article><h2>RECEBI UMA COMUNICAÇÃO SOBRE A SUBSTITUIÇÃO DO MEU CONTADOR. O QUE DEVO FAZER?</h2><p>Deve marcar o dia e hora que lhe forem mais convenientes, contactando a E-Redes:

Telefone: 218 100 100
WhatsApp: 913 846 398
Site: https://balcaodigital.e-redes.pt/home</p></article><article><h2>O QUE É NECESSÁRIO PARA TER UM CARREGADOR DE VEÍCULOS ELÉTRICOS?</h2><p>Inicialmente deve verificar a Potência Elétrica Disponível no local, escolher o Tipo de Carregador pretendido e entrar em contacto com o nosso departamento de orçamentação.</p></article></main><footer><address>Estrada Nacional 125, Bias Norte, Moncarapacho, 8700-066 Olhão, Portugal | Tel: +351 289 790 500 | Email: mail@joaquimfernandes.pt</address></footer></div><!-- PRERENDER:END --></noscript>
