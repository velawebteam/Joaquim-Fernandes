    <noscript><!-- PRERENDER:START --><div style="font-family:Montserrat,sans-serif;color:#1f2937;max-width:1120px;margin:0 auto;padding:32px 20px"><header><p><strong>Joaquim &amp; Fernandes, Lda</strong> — ¡La electricidad está con nosotros!</p><nav aria-label="Navegação"><a href="/es">Comenzar</a> | <a href="/es/sobre">Sobre nosotros</a> | <a href="/es/servicos">Servicios</a> | <a href="/es/iluminacao">Iluminação</a> | <a href="/es/parceiros">Fogonadura</a> | <a href="/es/recrutamento">Reclutamiento</a> | <a href="/es/contacto">Contactos</a> | <a href="/es/perguntas-frequentes">FAQs</a></nav></header><main><h1>Política de Privacidad</h1><p>JF respeta su privacidad y se compromete a proteger sus datos personales. Esta política describe cómo recopilamos, usamos y protegemos su información de acuerdo con el Reglamento General de Protección de Datos (Reglamento (UE) 2016/679 — RGPD) y la Ley portuguesa n.º 58/2019.</p><section><h2>Identificación Legal de la Empresa</h2><ul><li><strong>Denominación Social:</strong> Joaquim &amp; Fernandes - Electricidade e Telecomunicações LDA</li><li><strong>NIF:</strong> PT 501717307</li><li><strong>Email:</strong> mail@joaquimfernandes.pt</li><li><strong>Dirección:</strong> Est. Nac 125 Bias do Norte 8700-066 Olhão, 8700-066, Olhão</li></ul></section><section><h2>1. Responsable del Tratamiento</h2><p>La entidad responsable del tratamiento de sus datos personales es Joaquim &amp; Fernandes - Electricidade e Telecomunicações LDA (NIF: PT 501717307), con sede en Est. Nac 125 Bias do Norte 8700-066 Olhão, 8700-066, Olhão. Para cualquier consulta relacionada con la protección de datos, puede contactarnos por correo electrónico a mail@joaquimfernandes.pt o al teléfono +351 289 790 500.</p></section><section><h2>2. Datos recopilados</h2><p>Recopilamos los datos que usted nos proporciona voluntariamente a través de nuestros formularios de contacto, solicitudes de presupuesto, propuestas de colaboración y candidaturas de empleo. Estos podrán incluir: Nombre, Correo Electrónico, Teléfono, Dirección, datos de empresa, imágenes/proyectos técnicos y Curriculum Vitae (en el caso de contratación). También recopilamos datos técnicos estrictamente necesarios (cookies/almacenamiento local) según nuestra Política de Cookies.</p></section><section><h2>3. Finalidad y Base Jurídica del Tratamiento</h2><p>Sus datos son tratados únicamente bajo una base jurídica válida conforme al artículo 6 del RGPD:
- Gestión de solicitudes de presupuesto y contacto comercial (medidas precontractuales e interés legítimo);
- Ejecución de contratos de prestación de servicios y obra (ejecución contractual);
- Procesos de reclutamiento y selección mediante envío de candidatura y CV (consentimiento y medidas precontractuales);
- Cumplimiento de obligaciones legales y fiscales, incluida la facturación (obligación legal).</p></section><section><h2>4. Intercambio de datos y Encargados del Tratamiento</h2><p>No vendemos ni cedemos sus datos a terceros con fines comerciales. Sus datos solo podrán compartirse con subcontratistas estrictamente necesarios para el funcionamiento del sitio web y la prestación del servicio (p. ej., alojamiento, envío seguro de formularios, contabilidad, TI), sujetos a obligaciones RGPD, o con autoridades públicas cuando así lo exija la ley.</p></section><section><h2>5. Plazos de Conservación</h2><p>Los datos personales se conservan únicamente durante el tiempo necesario para la finalidad recogida o el plazo legal aplicable:
- Datos de facturación y documentación fiscal/contractual: 10 años (según la legislación fiscal portuguesa);
- Solicitudes de presupuesto y consultas comerciales sin adjudicación: hasta 2 años tras el último contacto;
- Candidaturas espontáneas y procesos de selección: hasta 1 año tras la finalización del proceso o recepción del CV, salvo solicitud previa de supresión.</p></section><section><h2>6. Derechos del Titular y Reclamación ante la CNPD</h2><p>Según el RGPD y la Ley portuguesa n.º 58/2019, tiene derecho a acceder, rectificar, suprimir (derecho al olvido), limitar, portar y oponerse al tratamiento de sus datos personales, así como a retirar su consentimiento en cualquier momento.

Para ejercer estos derechos, envíe una solicitud por escrito a mail@joaquimfernandes.pt.

Si considera que el tratamiento vulnera la normativa vigente, también tiene derecho a presentar una reclamación ante la autoridad de control competente en Portugal:
Comissão Nacional de Proteção de Dados (CNPD) — Av. D. Carlos I, 134, 1.º, 1200-651 Lisboa | Tel.: +351 213 928 400 | Email: geral@cnpd.pt | Web: www.cnpd.pt.</p></section><section><h2>7. Seguridad de los Datos</h2><p>Implementamos medidas técnicas y organizativas adecuadas (incluido cifrado HTTPS y control de acceso restringido) para proteger sus datos frente a pérdida, alteración o acceso no autorizado.</p></section></main><footer><address>Ruta Nacional 125, Bias Norte, Moncarapacho, 8700-066 Olhao, Portugal | Tel: +351 289 790 500 | Email: mail@joaquimfernandes.pt</address></footer></div><!-- PRERENDER:END --></noscript>
