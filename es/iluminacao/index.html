    <noscript><!-- PRERENDER:START --><div style="font-family:Montserrat,sans-serif;color:#1f2937;max-width:1120px;margin:0 auto;padding:32px 20px"><header><p><strong>Joaquim &amp; Fernandes, Lda</strong> — ¡La electricidad está con nosotros!</p><nav aria-label="Navegação"><a href="/es">Comenzar</a> | <a href="/es/sobre">Sobre nosotros</a> | <a href="/es/servicos">Servicios</a> | <a href="/es/iluminacao">Iluminação</a> | <a href="/es/parceiros">Fogonadura</a> | <a href="/es/recrutamento">Reclutamiento</a> | <a href="/es/contacto">Contactos</a> | <a href="/es/perguntas-frequentes">FAQs</a></nav></header><main><h1>Iluminación</h1><p>Ofrecemos soluciones completas de iluminación, desde alumbrado público hasta proyectos decorativos para épocas festivas, asegurando siempre servicios de mantenimiento y asistencia técnica especializada. Desarrollamos estudios luminotécnicos personalizados, con enfoque en la eficiencia energética, garantizando soluciones sostenibles, funcionales y adaptadas a las necesidades de cada proyecto.</p><ul><li><strong>Alumbrado Público</strong>: Garantizamos la seguridad y el bienestar de las poblaciones a través de redes de alumbrado público eficientes y confiables. Instalamos y mantenemos refuerzos viarios, proyectores y columnas, asegurando una correcta iluminación en vías, calles y espacios públicos, siempre enfocados en reducir la huella ecológica y los costos energéticos.</li><li><strong>Iluminación deportiva</strong>: En el deporte, la luz es fundamental para el rendimiento de los atletas y la experiencia de los espectadores. Diseñamos e instalamos sistemas de iluminación que cumplen estrictamente con los niveles de lux exigidos por las federaciones y estándares de radiodifusión televisiva. Garantizamos uniformidad en el campo, control de deslumbramiento y sistemas de iluminación instantánea para pabellones y estadios.</li><li><strong>Iluminación inteligente</strong>: Más que iluminar carreteras, creamos ciudades inteligentes. Nuestro enfoque en materia de alumbrado público se centra en la eficiencia energética y la seguridad. Sustituimos las luminarias convencionales por tecnología LED de altas prestaciones, integradas con sistemas de gestión remota que permiten el control remoto de la intensidad lumínica, la detección de averías en tiempo real y la reducción de la factura energética municipal hasta en un 60%. Destacamos la instalación de carriles inteligentes en Portimão, que aumentan la seguridad de los peatones a través de la señalización luminosa activa.</li><li><strong>Iluminación Técnica</strong>: La Iluminación Técnica pretende realzar el patrimonio construido por la noche, respetando su historia y diseño original. Utilizamos proyectores de precisión, tiras LED y sistemas RGBW para crear escenas dinámicas o estáticas que realzan texturas y volúmenes. Es la solución ideal para dar nueva vida a edificios, hoteles o monumentos emblemáticos, reforzando la identidad visual del lugar.</li><li><strong>Iluminación festiva</strong>: La Iluminación Festiva es el arte de crear emociones a través de la luz. Desarrollamos proyectos llave en mano para ocasiones especiales, transformando el entorno urbano y comercial. Desde el diseño creativo de los motivos (2D y 3D) hasta la instalación y desmontaje seguro, garantizamos un espectáculo visual que atrae visitantes, impulsa el comercio local y celebra la tradición con tecnología LED de bajo consumo.</li></ul></main><footer><address>Ruta Nacional 125, Bias Norte, Moncarapacho, 8700-066 Olhao, Portugal | Tel: +351 289 790 500 | Email: mail@joaquimfernandes.pt</address></footer></div><!-- PRERENDER:END --></noscript>
