nstant innovation.</li><li><strong>2018 — 1st PME Excellence</strong>: Reputation seal awarding the best economic-financial performances.</li><li><strong>2021 — Company Acquisition</strong>: Acquisition of JF by the current management, consolidating the company's future.</li><li><strong>2026 — Commitment to Prompt Payment Seal.</strong>: Recognition of the company's commitment to timely payments to its suppliers.</li></ul></main><footer><address>Estrada Nacional 125, Bias Norte, Moncarapacho, 8700-066 Olhão, Portugal, Portugal | Tel: +351 289 790 500 | Email: mail@joaquimfernandes.pt</address></footer></div><!-- PRERENDER:END --></noscript>
