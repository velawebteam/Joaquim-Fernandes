    <noscript><!-- PRERENDER:START --><div style="font-family:Montserrat,sans-serif;color:#1f2937;max-width:1120px;margin:0 auto;padding:32px 20px"><header><p><strong>Joaquim &amp; Fernandes, Lda</strong> — Electricity is Our Business!</p><nav aria-label="Navegação"><a href="/en">Home</a> | <a href="/en/sobre">About Us</a> | <a href="/en/servicos">Services</a> | <a href="/en/iluminacao">Iluminação</a> | <a href="/en/parceiros">Partners</a> | <a href="/en/recrutamento">Careers</a> | <a href="/en/contacto">Contacts</a> | <a href="/en/perguntas-frequentes">FAQs</a></nav></header><main><h1>FAQS</h1><p>Clarify your doubts about our services and procedures.</p><article><h2>I NEED TO CONNECT ELECTRICITY TO A LOCATION. WHAT ARE THE STEPS?</h2><p>To connect electricity to a house, shop, or land, you need to follow some steps in an organized and safe manner. At JF we handle the entire process; we just need some data/documents such as:

- Citizen Card, for individuals, or Permanent Certificate, for companies;
- Installation address, with indication of geographic coordinates;
- Property Booklet;
- Phone and email contacts.</p></article><article><h2>WHAT DO I NEED TO MAKE A GRID CONNECTION REQUEST (PLR)?</h2><p>At JF we handle the entire process and provide a totally free quote. It is only necessary that you:

- Provide all requested documentation;
- Indicate the type of grid connection intended;
- Indicate the power intended;

After adjudication of our quote, it will also be necessary to:
- Pay Fees to E-Redes (Variable values).</p></article><article><h2>WHAT ARE THE EXISTING TYPES OF GRID CONNECTION?</h2><p>- Grid connection for a single-family home.

- Grid connection for a company/business.

- Grid connection for a collective installation (e.g., buildings).

- Grid deviation: To change the location of existing grid elements (poles, lines, etc.).

- Works: To temporarily supply electricity to a site, with or without the need for a definitive connection later.

- Events: To supply electricity to a specific event and only for the period strictly necessary for its realization. These connections are typically for circuses, fairs, parties, street shows, among others.</p></article><article><h2>I NEED ELECTRICITY IN A PLACE WHERE THERE IS ALREADY A METER. HOW TO PROCEED?</h2><p>If the place already has a meter installed, or if it has had an electricity contract, you just need to contact a supplier to make an electricity supply contract.</p></article><article><h2>WHAT IS THE CPE?</h2><p>The CPE – Delivery Point Code – is the number that identifies your electrical installation.</p></article><article><h2>WHAT IS NIP?</h2><p>The NIP – Building Identification Number – is the number that identifies the collective installation and with which it is possible to consult all CPEs.</p></article><article><h2>I WANT TO INCREASE THE POWER OF MY INSTALLATION. WHAT SHOULD I DO?</h2><p>If the power you want to contract is lower than the maximum admissible power of the installation, the Customer should request an increase in contracted power from their Supplier.

In situations where the power you want to contract is higher than the maximum admissible power of the installation, the Customer may request a quote from us for a power increase.

The Customer must ensure that the installation is certified for the new power value.

If it is necessary to certify the installation, the Customer must resort to an electrical installation inspection entity recognized by the Directorate General for Energy and Geology (DGEG).</p></article><article><h2>IS IT POSSIBLE TO MOVE THE LOCATION OF MY METER?</h2><p>Yes, through a request to change the meter location, or alteration of the delivery point.</p></article><article><h2>I HAVE NO POWER, WHO SHOULD I CONTACT?</h2><p>You should contact E-Redes, through available means:

Phone: 800 506 506
WhatsApp: 913 846 398
Site: https://balcaodigital.e-redes.pt/home</p></article><article><h2>I RECEIVED A COMMUNICATION ABOUT REPLACING MY METER. WHAT SHOULD I DO?</h2><p>You should schedule the day and time that is most convenient for you by contacting E-Redes:

Phone: 218 100 100
WhatsApp: 913 846 398
Site: https://balcaodigital.e-redes.pt/home</p></article><article><h2>WHAT IS NEEDED TO HAVE AN ELECTRIC VEHICLE CHARGER?</h2><p>Initially, you must check the Available Electrical Power at the site, choose the Type of Charger intended, and contact our budgeting department.</p></article></main><footer><address>Estrada Nacional 125, Bias Norte, Moncarapacho, 8700-066 Olhão, Portugal, Portugal | Tel: +351 289 790 500 | Email: mail@joaquimfernandes.pt</address></footer></div><!-- PRERENDER:END --></noscript>
