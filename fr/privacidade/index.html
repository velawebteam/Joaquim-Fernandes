    <noscript><!-- PRERENDER:START --><div style="font-family:Montserrat,sans-serif;color:#1f2937;max-width:1120px;margin:0 auto;padding:32px 20px"><header><p><strong>Joaquim &amp; Fernandes, Lda</strong> — L'électricité est avec nous !</p><nav aria-label="Navegação"><a href="/fr">Commencer</a> | <a href="/fr/sobre">À propos de nous</a> | <a href="/fr/servicos">Services</a> | <a href="/fr/iluminacao">Iluminação</a> | <a href="/fr/parceiros">Partenaires</a> | <a href="/fr/recrutamento">Recrutement</a> | <a href="/fr/contacto">Contacts</a> | <a href="/fr/perguntas-frequentes">FAQs</a></nav></header><main><h1>Politique de Confidentialité</h1><p>JF respecte votre vie privée et s'engage à protéger vos données personnelles. Cette politique décrit la manière dont nous collectons, utilisons et protégeons vos informations conformément au Règlement Général sur la Protection des Données (Règlement (UE) 2016/679 — RGPD) et à la Loi portugaise n° 58/2019.</p><section><h2>Identification Légale de l'Entreprise</h2><ul><li><strong>Dénomination Sociale:</strong> Joaquim &amp; Fernandes - Electricidade e Telecomunicações LDA</li><li><strong>NIF:</strong> PT 501717307</li><li><strong>Email:</strong> mail@joaquimfernandes.pt</li><li><strong>Adresse:</strong> Est. Nac 125 Bias do Norte 8700-066 Olhão, 8700-066, Olhão</li></ul></section><section><h2>1. Responsable du traitement</h2><p>Le responsable du traitement de vos données personnelles est Joaquim &amp; Fernandes - Electricidade e Telecomunicações LDA (NIF : PT 501717307), dont le siège social est situé Est. Nac 125 Bias do Norte 8700-066 Olhão, 8700-066, Olhão. Pour toute question relative à la protection des données, vous pouvez nous contacter par e-mail à mail@joaquimfernandes.pt ou par téléphone au +351 289 790 500.</p></section><section><h2>2. Données collectées</h2><p>Nous collectons les données que vous nous fournissez volontairement via nos formulaires de contact, demandes de devis, propositions de partenariat et candidatures. Celles-ci peuvent inclure : nom, e-mail, téléphone, adresse, informations sur l'entreprise, photos/projets techniques et curriculum vitae (en cas de recrutement). Nous collectons également des données techniques strictement nécessaires (cookies/stockage local) conformément à notre Politique de Cookies.</p></section><section><h2>3. Finalité et base juridique du traitement</h2><p>Vos données sont traitées uniquement sur une base juridique valide conformément à l'article 6 du RGPD :
- Gestion des demandes de devis et des contacts commerciaux (mesures précontractuelles et intérêt légitime) ;
- Exécution des contrats de prestation de services et de travaux (exécution contractuelle) ;
- Processus de recrutement et de sélection via l'envoi de candidature et CV (consentement et mesures précontractuelles) ;
- Respect des obligations légales et fiscales, notamment la facturation (obligation légale).</p></section><section><h2>4. Partage des données et sous-traitants</h2><p>Nous ne vendons ni ne cédons vos données à des tiers à des fins commerciales. Vos données ne peuvent être partagées qu'avec des sous-traitants strictement nécessaires au fonctionnement du site et à la fourniture du service (par exemple hébergement, traitement sécurisé des formulaires, comptabilité, informatique), soumis aux obligations du RGPD, ou avec les autorités publiques lorsque la loi l'exige.</p></section><section><h2>5. Durées de conservation</h2><p>Les données personnelles ne sont conservées que pendant la durée nécessaire à la finalité pour laquelle elles ont été collectées ou selon les délais légaux applicables :
- Données de facturation et documents fiscaux/contractuels : 10 ans (selon la législation fiscale portugaise) ;
- Demandes de devis et contacts commerciaux sans conclusion de contrat : jusqu'à 2 ans après le dernier contact ;
- Candidatures spontanées et processus de recrutement : jusqu'à 1 an après la clôture du processus ou la réception du CV, sauf demande préalable de suppression.</p></section><section><h2>6. Droits du Titulaire et réclamation auprès de la CNPD</h2><p>Conformément au RGPD et à la Loi portugaise n° 58/2019, vous disposez d'un droit d'accès, de rectification, d'effacement (droit à l'oubli), de limitation, de portabilité et d'opposition au traitement de vos données personnelles, ainsi que du droit de retirer votre consentement à tout moment.

Pour exercer ces droits, adressez une demande écrite à mail@joaquimfernandes.pt.

Si vous estimez que le traitement de vos données n'est pas conforme à la réglementation, vous avez également le droit d'introduire une réclamation auprès de l'autorité de contrôle compétente au Portugal :
Comissão Nacional de Proteção de Dados (CNPD) — Av. D. Carlos I, 134, 1.º, 1200-651 Lisboa | Tél. : +351 213 928 400 | Email : geral@cnpd.pt | Site : www.cnpd.pt.</p></section><section><h2>7. Sécurité des données</h2><p>Nous mettons en œuvre des mesures techniques et organisationnelles appropriées (y compris chiffrement HTTPS et contrôle d'accès restreint) pour protéger vos données contre toute perte, altération ou accès non autorisé.</p></section></main><footer><address>Route nationale 125, Bias Norte, Moncarapacho, 8700-066 Olhão, Portugal | Tel: +351 289 790 500 | Email: mail@joaquimfernandes.pt</address></footer></div><!-- PRERENDER:END --></noscript>
