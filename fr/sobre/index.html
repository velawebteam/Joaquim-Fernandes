    <noscript><!-- PRERENDER:START --><div style="font-family:Montserrat,sans-serif;color:#1f2937;max-width:1120px;margin:0 auto;padding:32px 20px"><header><p><strong>Joaquim &amp; Fernandes, Lda</strong> — L'électricité est avec nous !</p><nav aria-label="Navegação"><a href="/fr">Commencer</a> | <a href="/fr/sobre">À propos de nous</a> | <a href="/fr/servicos">Services</a> | <a href="/fr/iluminacao">Iluminação</a> | <a href="/fr/parceiros">Partenaires</a> | <a href="/fr/recrutamento">Recrutement</a> | <a href="/fr/contacto">Contacts</a> | <a href="/fr/perguntas-frequentes">FAQs</a></nav></header><main><h1>Notre histoire</h1><p>Une équipe expérimentée, qualifiée et engagée envers l'excellence. La combinaison des connaissances techniques, de l'innovation et de l'expérience nous permet de répondre aux défis du secteur électrique avec efficacité, sécurité et professionnalisme.</p><ul><li><strong>1986 — Fondation de l'Entreprise</strong>: JF démarre son activité en tant que petite entreprise familiale axée sur les installations électriques dans la région de Olhão.</li><li><strong>1992 — Déménagement</strong>: Déménagement vers l'emplacement actuel.</li><li><strong>1998 — 1er Site Web</strong>: Lancement de notre première présence numérique, suivant l'évolution technologique.</li><li><strong>2000 — Leader de Consortium</strong>: Reconnu comme Leader de Consortium en Algarve pour EDP (actuel E-REDES).</li><li><strong>2001 — Certification de Qualité</strong>: Reconnu avec la Certification de Qualité, renforçant notre engagement envers la rigueur.</li><li><strong>2001 — Médaille de Dévouement</strong>: Médaille de dévouement – Grade Or décernée par la Municipalité de Olhão.</li><li><strong>2005 — Construction de Bureaux</strong>: Construction des bureaux actuels.</li><li><strong>2008 — 1er PME Líder</strong>: Distinction publique de notre solidité financière et de nos performances économiques.</li><li><strong>2011 — Nouvelle Direction</strong>: Début d'un nouveau cycle stratégique avec l'arrivée d'une nouvelle direction.</li><li><strong>2017 — Rénovation de l'Image</strong>: Modernisation de l'identité visuelle de l'entreprise, reflétant l'innovation constante.</li><li><strong>2018 — 1er PME Excellence</strong>: Label de réputation récompensant les meilleures performances économiques et financières.</li><li><strong>2021 — Acquisition de l'Entreprise</strong>: Acquisition de JF par la direction actuelle, consolidant l'avenir de l'entreprise.</li><li><strong>2026 — Sceau d'engagement de paiement ponctuel.</strong>: Reconnaissance de l'engagement de l'entreprise pour la ponctualité des paiements à ses fournisseurs.</li></ul></main><footer><address>Route nationale 125, Bias Norte, Moncarapacho, 8700-066 Olhão, Portugal | Tel: +351 289 790 500 | Email: mail@joaquimfernandes.pt</address></footer></div><!-- PRERENDER:END --></noscript>
