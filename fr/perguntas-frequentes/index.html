    <noscript><!-- PRERENDER:START --><div style="font-family:Montserrat,sans-serif;color:#1f2937;max-width:1120px;margin:0 auto;padding:32px 20px"><header><p><strong>Joaquim &amp; Fernandes, Lda</strong> — L'électricité est avec nous !</p><nav aria-label="Navegação"><a href="/fr">Commencer</a> | <a href="/fr/sobre">À propos de nous</a> | <a href="/fr/servicos">Services</a> | <a href="/fr/iluminacao">Iluminação</a> | <a href="/fr/parceiros">Partenaires</a> | <a href="/fr/recrutamento">Recrutement</a> | <a href="/fr/contacto">Contacts</a> | <a href="/fr/perguntas-frequentes">FAQs</a></nav></header><main><h1>FAQ</h1><p>Clarifiez vos doutes sur nos services et procédures.</p><article><h2>J'AI BESOIN DE METTRE L'ÉLECTRICITÉ DANS UN ENDROIT. QUELLES SONT LES ÉTAPES À SUIVRE ?</h2><p>Pour installer l'électricité dans une maison, un magasin ou un terrain, vous devez suivre certaines étapes de manière organisée et sûre. Chez JF, nous gérons l'ensemble du processus, nous avons juste besoin de quelques données/documents tels que :

- CPF, pour les particuliers ou certificat permanent, dans le cas d'une entreprise ; 
- Adresse de l'installation, indiquant les coordonnées géographiques ; 
- Livret de construction ; 
- Contacts téléphoniques et emails.</p></article><article><h2>DE QUOI DOIS-JE FAIRE UNE DEMANDE DE RACCORDEMENT AU RÉSEAU ÉLECTRIQUE (PLR) ?</h2><p>Chez JF, nous nous occupons de l'ensemble du processus et fournissons un devis entièrement gratuit, il vous suffit de :

- Fournir toute la documentation demandée ; 
- Indiquer le type de connexion réseau souhaité ; 
- Indiquer la puissance souhaitée ; 

Après avoir attribué notre budget, vous devrez également :
- Paiement des frais à E-Redes (Montants variables).</p></article><article><h2>QUELS TYPES DE CONNEXION RÉSEAU EXISTE-T-IL ?</h2><p>- Raccordement au réseau d'une maison unifamiliale. 

- Connexion réseau pour une entreprise/entreprise. 

- Raccordement au réseau d'une installation collective (par exemple : immeubles). 

- Décalage réseau : Pour modifier l'emplacement des éléments du réseau existants (poteaux, lignes, etc.). 

- Travaux : Fournir temporairement de l'énergie électrique à un endroit, avec ou sans nécessité ultérieure d'un raccordement permanent. 

- Événementiel : Fournir de l'électricité à un événement déterminé et uniquement pendant la période strictement nécessaire à la tenue de l'événement. Ces connexions sont généralement destinées aux cirques, foires, fêtes, spectacles de rue, entre autres.</p></article><article><h2>J'AI BESOIN D'ÉLECTRICITÉ DANS UN ENDROIT OÙ IL Y A DÉJÀ UN COMPTEUR. COMMENT PROCÉDER ?</h2><p>Si l'emplacement dispose déjà d'un compteur installé ou si vous aviez déjà un contrat d'électricité, il vous suffit de contacter une entreprise de services publics pour signer un contrat de fourniture d'électricité.</p></article><article><h2>QU'EST-CE QUE LE CPE ?</h2><p>Le CPE – Code Point de Livraison – est le numéro qui identifie votre installation électrique.</p></article><article><h2>QU'EST-CE QUE LE PIN ?</h2><p>Le NIP – Building Identification Number – est le numéro qui identifie l’installation collective et avec lequel il est possible de consulter tous les CPE.</p></article><article><h2>JE SOUHAITE AUGMENTER LA PUISSANCE DE MON INSTALLATION. QUE DOIS-JE FAIRE?</h2><p>Si la puissance que vous souhaitez contracter est inférieure à la puissance maximale autorisée de l'installation, le Client doit demander une augmentation de la puissance souscrite à son Fournisseur. 

Dans les situations où la puissance que vous souhaitez contracter est supérieure à la puissance maximale autorisée de l'installation, le Client peut demander un devis pour une augmentation de puissance. 

Le Client doit s'assurer que l'installation est certifiée pour la nouvelle valeur de puissance. 

S'il est nécessaire de certifier l'installation, le Client doit s'adresser à un organisme de contrôle des installations électriques reconnu par la Direction Générale de l'Energie et de la Géologie (DGEG).</p></article><article><h2>EST-IL POSSIBLE DE CHANGER LA LOCALISATION DE MON COMPTABLE ?</h2><p>Oui, via une demande de changement d'emplacement du compteur, ou de changement de point de livraison.</p></article><article><h2>JE SUIS SANS ÉLECTRICITÉ, QUI DOIS-JE CONTACTER ?</h2><p>Vous devez contacter E-Redes, par les moyens disponibles :

Téléphone : 800 506 506
WhatsApp : 913 846 398
Site Web : https://balcaodigital.e-redes.pt/home</p></article><article><h2>J'AI REÇU UNE COMMUNICATION CONCERNANT LE REMPLACEMENT DE MON COMPTEUR. QUE DOIS-JE FAIRE?</h2><p>Vous devez programmer le jour et l'heure qui vous conviennent le mieux en contactant E-Redes :

Téléphone : 218 100 100
WhatsApp : 913 846 398
Site Web : https://balcaodigital.e-redes.pt/home</p></article><article><h2>QU'EST-CE QUI EST NÉCESSAIRE POUR AVOIR UN CHARGEUR DE VÉHICULE ÉLECTRIQUE ?</h2><p>Dans un premier temps, vous devez vérifier l'alimentation électrique disponible sur place, choisir le type de chargeur souhaité et contacter notre service budgétaire.</p></article></main><footer><address>Route nationale 125, Bias Norte, Moncarapacho, 8700-066 Olhão, Portugal | Tel: +351 289 790 500 | Email: mail@joaquimfernandes.pt</address></footer></div><!-- PRERENDER:END --></noscript>
